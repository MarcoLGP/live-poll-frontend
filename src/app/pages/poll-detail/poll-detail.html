<div class="poll-detail-container">

  <div class="detail-header">
    <button class="back-btn" (click)="goBack()">
      {{ 'POLL_DETAIL.BACK' | translate }}
    </button>
    <span class="detail-label">{{ 'POLL_DETAIL.HIGHLIGHTED' | translate }}</span>
  </div>

  @if (loading()) {
    <div class="detail-loading">
      <div class="loading-card">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-option"></div>
        <div class="skeleton skeleton-option"></div>
        <div class="skeleton skeleton-option"></div>
      </div>
    </div>
  }

  @if (!loading() && notFound()) {
    <div class="detail-not-found">
      <div class="not-found-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </div>
      <div class="not-found-title">{{ 'POLL_DETAIL.NOT_FOUND' | translate }}</div>
      <div class="not-found-sub">{{ 'POLL_DETAIL.NOT_FOUND_SUB' | translate }}</div>
      <button class="back-btn-lg" (click)="goBack()">
        {{ 'POLL_DETAIL.BACK' | translate }}
      </button>
    </div>
  }

  @if (!loading() && poll()) {
    <div class="detail-card-wrap">
      <app-poll-card [poll]="poll()!" (vote)="onVote($event)" />
    </div>
  }

</div>
